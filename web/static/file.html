<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#14151a" />
    <meta
      name="description"
      content="Coda keeps a local music library linked to MusicBrainz, with tags Navidrome can read."
    />
    <title>File · Coda</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="file">
    <a class="skip-link" href="#main">
      Skip to content
    </a>

    <header class="mast" aria-label="Site">
      <div class="mast__inner">
        <a class="mast__brand" href="/" aria-label="Coda home">
          <img
            src="/logo.png"
            alt=""
            width="36"
            height="36"
            aria-hidden="true"
          />
          <span class="mast__word" translate="no">Coda</span>
        </a>

        <div class="mast__search" id="topbar-search">
          <label class="search">
            <input
              id="artist-search"
              name="artist-search"
              type="search"
              placeholder="Search your library…"
              autocomplete="off"
              aria-label="Search artists in your library"
              role="combobox"
              aria-expanded="false"
              aria-controls="artist-search-results"
              aria-autocomplete="list"
            />
          </label>
          <div
            class="mast__results topbar__results"
            id="artist-search-results"
            role="listbox"
            aria-label="Matching artists in your library"
            hidden
          ></div>
          <kbd class="mast__kbd topbar__kbd" aria-hidden="true">
            ⌘&nbsp;K
          </kbd>
        </div>

        <button
          class="btn btn--secondary btn--sm mast__rescan"
          id="rescan"
          type="button"
          title="Scan root folders for new or removed files"
        >
          Rescan
        </button>
      </div>
      <div class="mast__tabs">
        <nav class="mast__tabs-inner" aria-label="Library sections">
          <a href="/">
            Artists<span class="mast__tabs-count" data-stat="artists"></span>
          </a>
          <a href="/link">
            Unlinked<span class="mast__tabs-count" data-stat="unlinked_files"></span>
          </a>
          <a href="/files" aria-current="page">
            All files<span class="mast__tabs-count" data-stat="total_files"></span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page" id="main" tabindex="-1">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/files">All files</a>
        <span>/</span>
        <span id="crumb">File</span>
      </nav>

      <header class="lib-head">
        <div>
          <h1 id="file-name">File</h1>
          <p class="lib-head__desc mono" id="file-path" translate="no"></p>
        </div>
        <div class="lib-head__actions" id="actions"></div>
      </header>

      <div class="notice" id="status">
        Loading file…
      </div>

      <div id="content" hidden>
        <div class="stat-row">
          <div class="stat-card">
            <span class="stat-card__label">Format</span>
            <span class="stat-card__value" id="stat-format">
              —
            </span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Size</span>
            <span class="stat-card__value" id="stat-size">
              —
            </span>
          </div>
          <div class="stat-card">
            <span class="stat-card__label">Scanned</span>
            <span class="stat-card__value" id="stat-scanned">
              —
            </span>
          </div>
          <div class="stat-card" id="stat-link-card">
            <span class="stat-card__label">Link</span>
            <span class="stat-card__value" id="stat-link">
              —
            </span>
          </div>
        </div>

        <div class="table-wrap" id="detail-wrap">
          <table class="data-table detail-table">
            <tbody>
              <tr>
                <th scope="row">Path</th>
                <td class="mono" id="detail-path" translate="no"></td>
              </tr>
              <tr>
                <th scope="row">Format hint</th>
                <td id="detail-format"></td>
              </tr>
              <tr>
                <th scope="row">Size</th>
                <td id="detail-size"></td>
              </tr>
              <tr>
                <th scope="row">Modified</th>
                <td id="detail-mtime"></td>
              </tr>
              <tr>
                <th scope="row">Scanned</th>
                <td id="detail-scanned"></td>
              </tr>
              <tr>
                <th scope="row">Track MBID</th>
                <td class="mono" id="detail-track" translate="no"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="link-panel" class="link-panel-slot"></div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/page-file.js"></script>
  </body>
</html>
