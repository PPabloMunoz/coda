name: coda

services:
  coda:
    image: ghcr.io/ppablomunoz/coda:${CODA_TAG:-latest}
    # Lidarr-style ownership: files coda moves/tags are written as PUID:PGID.
    # Make sure the music and data dirs are owned by the same ids on the host
    # (e.g. `sudo chown -R 1000:1000 music data`), otherwise the scan
    # fails and linking cannot move files.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Coda has no authentication: bind to 127.0.0.1 (or put it behind a
      # reverse proxy) unless your LAN is trusted.
      - "${CODA_PORT:-8687}:8687"
    # CODA_ROOTS, CODA_CONFIG, CODA_DB_PATH and GIN_MODE are set in the image.
    volumes:
      - ${MUSIC_DIR:-./music}:/music
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
    # Coda's graceful shutdown allows up to 10s; Docker's default 10s grace
    # would SIGKILL it right at that edge and could cut a SQLite write short.
    stop_grace_period: 20s
    # Hardening. Only /music and /data are written; drop read_only/tmpfs if
    # something unexpected needs to write elsewhere.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The healthcheck is defined in the image (HEALTHCHECK in the Dockerfile).
