version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor/...
    rules:
      # Fixture files only: 0644 keeps committed testdata-style helpers
      # simple and uint32 length prefixes mirror the binary format.
      - path: _test\.go
        linters: [gosec]
        text: "G306|G115"
      # Store queries compose only static fragments and ? placeholder
      # lists; every value is bound. Keep gosec active elsewhere.
      - path: internal/store/
        linters: [gosec]
        text: "G202"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ppablomunoz/coda
  exclusions:
    generated: lax
    paths:
      - vendor/...

issues:
  max-issues-per-linter: 50
  max-same-issues: 20
