name: coda

services:
  coda:
    image: ghcr.io/ppablomunoz/coda:latest
    # Lidarr-style ownership: files coda moves/tags are written as PUID:PGID.
    # Make sure ./music and ./data are owned by the same ids on the host
    # (e.g. `sudo chown -R 1000:1000 music data`), otherwise the scan
    # fails and linking cannot move files.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8687:8687"
    environment:
      CODA_PORT: "8687"
      CODA_ROOTS: /music
      CODA_CONFIG: /data/config.yaml
      CODA_DB_PATH: /data/coda.db
      GIN_MODE: release
    volumes:
      - ./music:/music:rw
      - ./data:/data:rw
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8687/api/v1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
