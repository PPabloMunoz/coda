<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#14151a" />
    <meta
      name="description"
      content="Coda keeps a local music library linked to MusicBrainz, with tags Navidrome can read."
    />
    <title>Artist · Coda</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="artist">
    <a class="skip-link" href="#main">
      Skip to content
    </a>

    <header class="mast" aria-label="Site">
      <div class="mast__inner">
        <a class="mast__brand" href="/" aria-label="Coda home">
          <img
            src="/logo.png"
            alt=""
            width="36"
            height="36"
            aria-hidden="true"
          />
          <span class="mast__word" translate="no">Coda</span>
        </a>

        <div class="mast__search" id="topbar-search">
          <label class="search">
            <input
              id="artist-search"
              name="artist-search"
              type="search"
              placeholder="Search your library…"
              autocomplete="off"
              aria-label="Search artists in your library"
              role="combobox"
              aria-expanded="false"
              aria-controls="artist-search-results"
              aria-autocomplete="list"
            />
          </label>
          <div
            class="mast__results topbar__results"
            id="artist-search-results"
            role="listbox"
            aria-label="Matching artists in your library"
            hidden
          ></div>
          <kbd class="mast__kbd topbar__kbd" aria-hidden="true">
            ⌘&nbsp;K
          </kbd>
        </div>

        <button
          class="btn btn--secondary btn--sm mast__rescan"
          id="rescan"
          type="button"
          title="Scan root folders for new or removed files"
        >
          Rescan
        </button>
      </div>
      <div class="mast__tabs">
        <nav class="mast__tabs-inner" aria-label="Library sections">
          <a href="/" aria-current="page">
            Artists<span class="mast__tabs-count" data-stat="artists"></span>
          </a>
          <a href="/link">
            Unlinked<span class="mast__tabs-count" data-stat="unlinked_files"></span>
          </a>
          <a href="/files">
            All files<span class="mast__tabs-count" data-stat="total_files"></span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page" id="main" tabindex="-1">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/">Artists</a>
        <span>/</span>
        <span id="crumb">Artist</span>
      </nav>

      <div class="notice" id="status">
        Loading artist…
      </div>

      <div id="content" hidden>
        <header class="detail-hero">
          <div class="detail-hero__art" id="hero-art"></div>
          <div class="detail-hero__body">
            <h1><span id="artist-name"></span></h1>
            <p class="detail-hero__meta" id="artist-meta"></p>
            <div class="detail-hero__actions" id="artist-actions"></div>
            <p class="ext-links" id="artist-mb-row" hidden>
              <a
                id="artist-mb"
                class="ext-link"
                href="/"
                target="_blank"
                rel="noreferrer noopener"
                aria-label="Open on MusicBrainz"
              ><img class="mb-logo" src="/musicbrainz.svg" alt="" aria-hidden="true" /><span>MusicBrainz</span></a>
            </p>
            <p class="import-status" id="import-status" role="status" hidden></p>
            <p class="hero-facts">
              <span><strong id="track-total">—</strong> tracks linked</span>
            </p>
            <div
              class="linked-bar"
              id="linked-bar"
              role="progressbar"
              aria-label="Tracks linked"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              data-state="empty"
            >
              <span class="linked-bar__fill" id="linked-fill"></span>
            </div>
          </div>
        </header>

        <section>
          <div class="section-head">
            <div>
              <h2>Release groups</h2>
            </div>
            <span class="section-head__meta" id="group-status"></span>
          </div>

          <div class="toolbar">
            <label class="search">
              <input
                id="filter"
                name="q"
                type="search"
                placeholder="Filter by title…"
                autocomplete="off"
                aria-label="Filter release groups"
              />
            </label>
            <div
              class="legend"
              style="margin-left: auto"
              aria-label="Link completeness"
            >
              <span class="legend__item">
                <span
                  class="legend__dot legend__dot--complete"
                  aria-hidden="true"
                ></span>
                Complete
                <span class="legend__count" id="legend-complete">
                  —
                </span>
              </span>
              <span class="legend__item">
                <span
                  class="legend__dot legend__dot--partial"
                  aria-hidden="true"
                ></span>
                Partial
                <span class="legend__count" id="legend-partial">
                  —
                </span>
              </span>
              <span class="legend__item">
                <span
                  class="legend__dot legend__dot--missing"
                  aria-hidden="true"
                ></span>
                Missing
                <span class="legend__count" id="legend-missing">
                  —
                </span>
              </span>
            </div>
          </div>

          <div class="rg-sections" id="groups" aria-live="polite"></div>
          <div id="groups-empty" hidden></div>
        </section>

        <section id="appears-section" hidden>
          <div class="section-head">
            <div>
              <h2>Appears in</h2>
            </div>
            <span class="section-head__meta" id="appears-status"></span>
          </div>

          <div class="rg-sections" id="appears-groups" aria-live="polite"></div>
          <div id="appears-empty" hidden></div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/page-artist.js"></script>
  </body>
</html>
