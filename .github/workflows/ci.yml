name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # installer only: just check runs the real lint once
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --version

      - uses: extractions/setup-just@v3

      # web-build first so go:embed has web/dist
      - run: just web-build
      - run: just check

      # verify the static production build still works
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/coda
