version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor/...

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ppablomunoz/coda
  exclusions:
    generated: lax
    paths:
      - vendor/...

issues:
  max-issues-per-linter: 50
  max-same-issues: 20
