<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#14151a" />
    <meta
      name="description"
      content="Coda keeps a local music library linked to MusicBrainz, with tags Navidrome can read."
    />
    <title>Artists · Coda</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">
      Skip to content
    </a>

    <header class="mast" aria-label="Site">
      <div class="mast__inner">
        <a class="mast__brand" href="/" aria-label="Coda home">
          <img
            src="/logo.png"
            alt=""
            width="36"
            height="36"
            aria-hidden="true"
          />
          <span class="mast__word" translate="no">Coda</span>
        </a>

        <div class="mast__search" id="topbar-search">
          <label class="search">
            <input
              id="artist-search"
              name="artist-search"
              type="search"
              placeholder="Search your library…"
              autocomplete="off"
              aria-label="Search artists in your library"
              role="combobox"
              aria-expanded="false"
              aria-controls="artist-search-results"
              aria-autocomplete="list"
            />
          </label>
          <div
            class="mast__results topbar__results"
            id="artist-search-results"
            role="listbox"
            aria-label="Matching artists in your library"
            hidden
          ></div>
          <kbd class="mast__kbd topbar__kbd" aria-hidden="true">
            ⌘K
          </kbd>
        </div>

        <button
          class="btn btn--secondary btn--sm mast__rescan"
          id="rescan"
          type="button"
          title="Scan root folders for new or removed files"
        >
          Rescan
        </button>
      </div>
      <div class="mast__tabs">
        <nav class="mast__tabs-inner" aria-label="Library sections">
          <a href="/" aria-current="page">
            Artists<span class="mast__tabs-count" data-stat="artists"></span>
          </a>
          <a href="/link">
            Unlinked<span class="mast__tabs-count" data-stat="unlinked_files"></span>
          </a>
          <a href="/files">
            All files<span class="mast__tabs-count" data-stat="total_files"></span>
          </a>
          <a
            class="mast__tabs-ext"
            href="https://musicbrainz.org"
            target="_blank"
            rel="noreferrer noopener"
            aria-label="MusicBrainz"
          >
            <img class="mb-logo" src="/musicbrainz.svg" alt="" aria-hidden="true" />
          </a>
        </nav>
      </div>
    </header>

    <main class="page lib" id="main" tabindex="-1">
      <header class="lib-head">
        <div>
          <h1>Artists</h1>
          <p class="lib-head__desc">Everyone with files on disk. Open an artist to review releases and link what is missing.</p>
        </div>
        <div class="lib-head__actions">
          <button class="btn btn--secondary" id="refresh" type="button">
            Refresh list
          </button>
          <button class="btn btn--primary" id="add-open" type="button">
            Add artist
          </button>
        </div>
      </header>

      <div class="toolbar">
        <label class="search">
          <input
            id="filter"
            name="q"
            type="search"
            placeholder="Filter by name…"
            autocomplete="off"
            aria-label="Filter artists by name"
          />
        </label>
        <span class="toolbar__count" id="status">
          Loading artists…
        </span>
      </div>

      <div class="artist-grid lib-grid" id="grid" aria-live="polite"></div>
      <div id="empty" hidden></div>

      <dialog id="add-dialog" aria-labelledby="add-title">
        <form class="dialog__panel" id="add-form">
          <div class="dialog__head">
            <div>
              <p class="eyebrow">New artist</p>
              <h2 id="add-title">Add an artist</h2>
            </div>
            <button
              class="icon-btn"
              id="add-close"
              type="button"
              aria-label="Close"
            >
              ×
            </button>
          </div>

          <p class="dialog__copy">
            Find the artist on MusicBrainz, then Coda pulls the discography
            and matches your files.
          </p>

          <div class="dialog__search">
            <label class="field">
              <span>Search MusicBrainz</span>
              <input
                id="add-artist-search"
                name="add-artist-search"
                type="search"
                placeholder="Artist name…"
                autocomplete="off"
              />
            </label>
            <button
              class="btn btn--secondary"
              id="artist-search-submit"
              type="button"
            >
              Search
            </button>
          </div>

          <div
            class="picker__list artist-results"
            id="artist-results"
            aria-live="polite"
          ></div>

          <p class="dialog__divider">
            <span>or paste an ID</span>
          </p>

          <label class="field">
            <span>MusicBrainz ID or URL</span>
            <input
              id="mbid"
              name="mbid"
              placeholder="e.g. c3d7f812-47b2-4d78-9ac2-9512817d8add"
              autocomplete="off"
              spellcheck="false"
              required
            />
          </label>

          <p class="form-status" id="add-status" role="status"></p>

          <div class="dialog__actions">
            <button class="btn btn--ghost" id="add-cancel" type="button">
              Cancel
            </button>
            <button class="btn btn--primary" id="add-submit" type="submit">
              Add artist
            </button>
          </div>
        </form>
      </dialog>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/page-index.js"></script>
  </body>
</html>
