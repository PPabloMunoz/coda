<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width" />
    <meta name="theme-color" content="#14151a" />
    <meta
      name="description"
      content="Coda keeps a local music library linked to MusicBrainz, with tags Navidrome can read."
    />
    <title>All files · Coda</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="files">
    <a class="skip-link" href="#main">
      Skip to content
    </a>

    <header class="mast" aria-label="Site">
      <div class="mast__inner">
        <a class="mast__brand" href="/" aria-label="Coda home">
          <img
            src="/logo.png"
            alt=""
            width="36"
            height="36"
            aria-hidden="true"
          />
          <span class="mast__word" translate="no">Coda</span>
        </a>

        <div class="mast__search" id="topbar-search">
          <label class="search">
            <input
              id="artist-search"
              name="artist-search"
              type="search"
              placeholder="Search your library…"
              autocomplete="off"
              aria-label="Search artists in your library"
              role="combobox"
              aria-expanded="false"
              aria-controls="artist-search-results"
              aria-autocomplete="list"
            />
          </label>
          <div
            class="mast__results topbar__results"
            id="artist-search-results"
            role="listbox"
            aria-label="Matching artists in your library"
            hidden
          ></div>
          <kbd class="mast__kbd topbar__kbd" aria-hidden="true">
            ⌘K
          </kbd>
        </div>

        <button
          class="btn btn--secondary btn--sm mast__rescan"
          id="rescan"
          type="button"
          title="Scan root folders for new or removed files"
        >
          Rescan
        </button>
      </div>
      <div class="mast__tabs">
        <nav class="mast__tabs-inner" aria-label="Library sections">
          <a href="/">
            Artists<span class="mast__tabs-count" data-stat="artists"></span>
          </a>
          <a href="/link">
            Unlinked<span class="mast__tabs-count" data-stat="unlinked_files"></span>
          </a>
          <a href="/files" aria-current="page">
            All files<span class="mast__tabs-count" data-stat="total_files"></span>
          </a>
          <a
            class="mast__tabs-ext"
            href="https://musicbrainz.org"
            target="_blank"
            rel="noreferrer noopener"
            aria-label="MusicBrainz"
          >
            <img class="mb-logo" src="/musicbrainz.svg" alt="" aria-hidden="true" />
          </a>
        </nav>
      </div>
    </header>

    <main class="page" id="main" tabindex="-1">
      <header class="lib-head">
        <div>
          <h1>All files</h1>
          <p class="lib-head__desc">Every audio file Coda has scanned from your configured roots.</p>
        </div>
        <div class="lib-head__actions">
          <a class="btn btn--primary" href="/link">
            Link files
          </a>
        </div>
      </header>

      <div class="toolbar">
        <label class="search">
          <input
            id="filter"
            name="q"
            type="search"
            placeholder="Search all files by path…"
            autocomplete="off"
            aria-label="Search all files by path"
          />
        </label>
        <label class="inline-field">
          <span>Sort</span>
          <select id="sort">
            <option value="path:asc" selected>
              Path A–Z
            </option>
            <option value="path:desc">Path Z–A</option>
            <option value="size:desc">Largest first</option>
            <option value="size:asc">Smallest first</option>
            <option value="scanned_at:desc">Recently scanned</option>
            <option value="format:asc">Format</option>
          </select>
        </label>
        <span class="toolbar__count" id="status">
          Loading files…
        </span>
        <label class="inline-field">
          <span>Per page</span>
          <select id="limit">
            <option value="25">25</option>
            <option value="50" selected>
              50
            </option>
            <option value="100">100</option>
          </select>
        </label>
      </div>

      <div class="file-list" id="list" aria-live="polite"></div>
      <div id="empty" hidden></div>

      <div class="toolbar toolbar--after">
        <button class="btn btn--secondary" id="prev" type="button">
          Previous
        </button>
        <span class="toolbar__count" id="page-info"></span>
        <button class="btn btn--secondary" id="next" type="button">
          Next
        </button>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/page-files.js"></script>
  </body>
</html>
